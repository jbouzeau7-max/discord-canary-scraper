name: Setup Node + deps
description: Node 22 + npm ci à partir du lockfile versionné
inputs:
  node-version:
    description: Version de Node
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
    # Vitesse : node_modules restauré depuis le cache (clé = lockfile) → npm ci
    # sauté quand le cache est chaud (gain ~5-15 s par run).
    - name: Cache node_modules
      id: nm-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: nm-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
    - name: npm ci
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund --prefer-offline
