name: Setup Node + deps
description: Node 22 + npm install (auto-drops broken lockfile)
inputs:
  node-version:
    description: Version de Node
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
    - name: npm install
      shell: bash
      run: |
        if [ -f package-lock.json ] && grep -q 'sha512-example' package-lock.json 2>/dev/null; then
          echo "Removing invalid package-lock.json"
          rm -f package-lock.json
        fi
        npm install --no-audit --no-fund
