name: News

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-news]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Fetch news
        id: news
        env:
          NEWS_WEBHOOK_URL: ${{ secrets.NEWS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
        run: node src/news.js

      - name: Save seen
        if: always() && steps.news.outcome != 'cancelled'
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          bash scripts/commit-state.sh "news: seen" data/seen_news.json || true
