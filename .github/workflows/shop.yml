name: Shop

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-shop]

permissions:
  contents: write

concurrency:
  group: shop
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Track shop
        id: shop
        env:
          SHOP_WEBHOOK_URL: ${{ secrets.SHOP_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
        run: node src/shop.js

      - name: Save state
        if: always() && steps.shop.outcome != 'cancelled'
        run: |
          bash scripts/commit-state.sh "shop: state" data/shop_itemshop.json
