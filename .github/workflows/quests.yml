name: Discord Quests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-quests]

permissions:
  contents: write

concurrency:
  group: discord-quests
  cancel-in-progress: false

jobs:
  quests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Track Discord quests
        id: quests
        env:
          QUEST_WEBHOOK_URL: ${{ secrets.QUEST_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
          QUESTS_WATCH_MS: "270000"
          QUESTS_POLL_MS: "30000"
        run: node src/quests.js

      - name: Save quest state
        if: always() && steps.quests.outcome != 'cancelled'
        run: |
          bash scripts/commit-state.sh "quests: state" data/quests.json
