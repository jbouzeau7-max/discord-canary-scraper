name: Scrape Discord Canary

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      once:
        description: "true = un seul scrape (ancien mode), false = watcher temps réel"
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-scraping]

permissions:
  contents: write

concurrency:
  group: canary-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Scrape
        id: scrape
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_USER_TOKEN_2: ${{ secrets.DISCORD_USER_TOKEN_2 }}
          DISCORD_USER_TOKEN_3: ${{ secrets.DISCORD_USER_TOKEN_3 }}
          DISCORD_USER_TOKEN_4: ${{ secrets.DISCORD_USER_TOKEN_4 }}
          DISCORD_USER_TOKEN_5: ${{ secrets.DISCORD_USER_TOKEN_5 }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # Compatibilité avec le secret historique WEBHOOK_URL.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.WEBHOOK_URL }}
          ORBIT_BOT_NAME: Datamining
          # Watcher : sonde version.canary.json toutes les 2 s et lance le
          # scrape dès qu'un build sort (runner déjà chaud → pas de 30 s+ de
          # démarrage). Le run suivant (cron */5) attend en relais.
          SCRAPE_WATCH_MS: "1680000"
          SCRAPE_WATCH_TICK_MS: "2000"
          ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.once && '1' || '0' }}
        run: |
          if [ "$ONCE" = "1" ]; then node src/index.js; else node src/scrape_watch.js; fi

      - name: Commit state
        id: commit_state
        if: always() && steps.scrape.outcome != 'cancelled'
        env:
          COMMIT_RECOVERY_PATCH: ${{ runner.temp }}/scrape-state-recovery.patch
        run: |
          bash scripts/commit-state.sh "scrape: state" data/

      - name: Preserve unpushed state for recovery
        if: always() && steps.commit_state.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-state-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/scrape-state-recovery.patch*
          if-no-files-found: warn
          retention-days: 7
