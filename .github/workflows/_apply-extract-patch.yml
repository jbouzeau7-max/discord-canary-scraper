name: Apply extract patch (one-shot)

# Workflow jetable : applique scripts/_patch_extract.js (pré-filtre de routes +
# scan des chunks en workers) puis se supprime lui-même, avec le script, dans le
# commit qui contient le résultat. Un push fait avec GITHUB_TOKEN ne relance
# aucun workflow : pas de boucle.

on:
  push:
    paths:
      - scripts/_patch_extract.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Patch src/lib/extract.js
        run: node scripts/_patch_extract.js

      - name: Vérifier et tester
        run: |
          node --check src/lib/extract.js
          npm ci --no-audit --no-fund --prefer-offline
          node --test --test-concurrency=1 test/extract*.test.js

      - name: Committer puis supprimer le workflow jetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q scripts/_patch_extract.js .github/workflows/_apply-extract-patch.yml
          git add src/lib/extract.js
          git commit -m "scrape: pré-filtre de routes + scan des chunks en workers (extract.js)"
          git push
