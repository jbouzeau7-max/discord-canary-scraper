name: Apply mobile patch (one-shot)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-mobile-patch.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mobile-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Download + verify patch
        run: |
          curl -fsSL https://paste.rs/Swued -o /tmp/m.patch
          echo 'af534a919221959c7ad4eaca1027eea0ac4f14098b3c19b471fb2e2f8e641b5e  /tmp/m.patch' | sha256sum -c -
      - name: Apply
        run: |
          if grep -q 'computeMobileDiff' src/mobile_from_files.js; then echo 'already applied'; exit 0; fi
          git apply --3way /tmp/m.patch
      - name: Verify (check + lint + tests)
        run: npm run verify
      - name: Commit + push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src test eslint.config.js
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -m 'mobile: experiments added/modified/removed, strings, routes (Canary-style) + no skipped versions'
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
