name: News Avatars

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: news-avatars
  cancel-in-progress: false

jobs:
  avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate avatars
        run: |
          if [ -f scripts/gen_news_avatars.py ]; then
            python3 scripts/gen_news_avatars.py
          else
            echo "scripts/gen_news_avatars.py not present yet"
          fi

      - name: Commit media
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          bash scripts/commit-state.sh "media: photos de profil Actus" media || true
