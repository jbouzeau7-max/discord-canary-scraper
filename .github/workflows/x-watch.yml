name: X Watch · @discordnew8r

# Surveille https://x.com/discordnew8r — chaque nouveau post → webhook Discord.
# API : twikit (guest, ou cookies via secret TWIKIT_COOKIES_JSON).
# Actif seulement si X_WATCH_WEBHOOK_URL (ou TWITTER_WEBHOOK_URL / DISCORD_WEBHOOK_URL) existe.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-x-watch]

permissions:
  contents: write

concurrency:
  group: x-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install twikit
        run: |
          python -m pip install --upgrade pip
          pip install 'twikit>=2.3.0' 'httpx[socks]' beautifulsoup4 lxml filetype pyotp

      - name: Watch @discordnew8r
        id: watch
        env:
          X_WATCH_WEBHOOK_URL: ${{ secrets.X_WATCH_WEBHOOK_URL }}
          TWITTER_WEBHOOK_URL: ${{ secrets.TWITTER_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_WATCH_SCREEN_NAME: ${{ vars.X_WATCH_SCREEN_NAME }}
          TWIKIT_COOKIES_JSON: ${{ secrets.TWIKIT_COOKIES_JSON }}
          TWIKIT_AUTH_INFO_1: ${{ secrets.TWIKIT_AUTH_INFO_1 }}
          TWIKIT_AUTH_INFO_2: ${{ secrets.TWIKIT_AUTH_INFO_2 }}
          TWIKIT_PASSWORD: ${{ secrets.TWIKIT_PASSWORD }}
        run: python scripts/x_watch.py

      - name: Save seen ids
        if: always() && steps.watch.outcome != 'cancelled'
        env:
          COMMIT_SOFT_FAIL: '1'
        run: |
          scripts/commit-state.sh "x-watch: seen" data/seen_x_posts.json
