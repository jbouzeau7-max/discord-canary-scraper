name: X Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-x-watch]

permissions:
  contents: write

concurrency:
  group: x-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: X watch
        id: xwatch
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_WEBHOOK_URL: ${{ secrets.X_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f scripts/x_watch.py ]; then
            python3 scripts/x_watch.py
          else
            echo "scripts/x_watch.py not present yet"
          fi

      - name: Save seen
        if: always() && steps.xwatch.outcome != 'cancelled'
        run: |
          bash scripts/commit-state.sh "x-watch: seen" data/seen_x_posts.json
