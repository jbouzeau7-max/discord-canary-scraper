name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Sync data into docs
        run: |
          mkdir -p docs/data
          # Doit couvrir TOUS les JSON chargés par docs/*.js. user_rollouts
          # (rollouts.js) et shop_items (shop.js) manquaient → 404.
          for f in experiments findings routes build last_run_meta mobile_versions mobile_experiments experiment_rollouts user_rollouts shop_items; do
            if [ -f "data/$f.json" ]; then cp "data/$f.json" "docs/data/$f.json"; fi
          done

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
